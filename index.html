<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay 50 Món</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f7f9fc;
            margin: 0;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .wheel-container {
            position: relative;
            width: 500px;
            height: 500px;
        }

        /* Mũi tên chỉ hướng trúng thưởng */
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 45px solid #ff4757;
            z-index: 10;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2));
        }

        /* Canvas vẽ vòng quay */
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        /* Nút bấm ở tâm */
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85px;
            height: 85px;
            background-color: #fff;
            border: 4px solid #ff4757;
            border-radius: 50%;
            color: #ff4757;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            user-select: none;
            z-index: 5;
        }

        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* Kết quả hiển thị */
        #result {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #2ed573;
            min-height: 38px;
            text-align: center;
            padding: 12px 25px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <h1>Vòng Quay May Mắn 50 Món</h1>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
        <button class="spin-btn" id="spinBtn">QUAY</button>
    </div>

    <div id="result">Nhấn QUAY để chọn món!</div>

    <script>
        // 1. Tạo danh sách 50 món (Bạn có thể thay đổi tên các món ăn cụ thể tại đây)
        const items = [];
        for (let i = 1; i <= 50; i++) {
            items.push(`Món ăn số ${i}`);
        }

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultDisplay = document.getElementById('result');

        const numSegments = items.length;
        const arc = 2 * Math.PI / numSegments;
        const radius = canvas.width / 2;

        // Bảng màu xen kẽ giúp vòng quay bắt mắt hơn
        const colors = ["#ff6b6b", "#4eae50", "#3399ff", "#f1c40f", "#9b59b6", "#e67e22"];

        // 2. Hàm vẽ vòng quay và số thứ tự lên ô
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < numSegments; i++) {
                const angle = i * arc;
                
                // Vẽ hình quạt
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius, angle, angle + arc);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.closePath();

                // Vẽ số thứ tự lên từng ô quạt
                ctx.save();
                ctx.translate(radius, radius);
                // Xoay canvas đến giữa ô quạt hiện tại
                ctx.rotate(angle + arc / 2);
                
                // Cấu hình chữ
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px Arial";
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                
                // Đặt vị trí chữ cách rìa vòng quay một khoảng nhỏ
                ctx.fillText(i + 1, radius - 15, 0);
                ctx.restore();
            }
        }

        drawWheel();

        // 3. Logic quay thưởng
        let currentRotation = 0;
        let isSpinning = false;

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            
            isSpinning = true;
            resultDisplay.innerText = "Đang chọn món ngon...";
            
            // Xoay ngẫu nhiên từ 5 đến 10 vòng bổ sung thêm góc lẻ
            const randomDegrees = Math.floor(3600 + Math.random() * 3600);
            currentRotation += randomDegrees;
            
            // Thực hiện hiệu ứng quay bằng CSS
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Thời gian chờ khớp với thời gian transition CSS (5 giây)
            setTimeout(() => {
                isSpinning = false;
                
                // Đưa góc quay về phạm vi từ 0 đến 360 độ
                const actualDegrees = currentRotation % 360;
                
                // Tính toán góc đích dựa trên vị trí mũi tên ở đỉnh (hướng 12 giờ)
                const targetAngle = (3 * Math.PI / 2 - (actualDegrees * Math.PI / 180)) % (2 * Math.PI);
                const positiveAngle = targetAngle < 0 ? targetAngle + 2 * Math.PI : targetAngle;
                
                // Xác định vị trí phần tử trúng giải
                let selectedIndex = Math.floor(positiveAngle / arc);
                
                if(selectedIndex >= numSegments) selectedIndex = numSegments - 1;
                if(selectedIndex < 0) selectedIndex = 0;

                // Hiển thị kết quả ra màn hình và thông báo popup
                const chuoiKetQua = `Kết quả: Ô số ${selectedIndex + 1} - ${items[selectedIndex]}`;
                resultDisplay.innerText = chuoiKetQua;
                
                alert(`🎉 ${chuoiKetQua}`);
            }, 5000);
        });
    </script>

</body>
</html>
